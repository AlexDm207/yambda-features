seed: 42

data:
  # уже скачанный в прошлом задании файл; путь можно поменять
  raw_path: D:/yambda-rl/data/raw/flat/50m/multi_event.parquet
  artist_map: data/raw/artist_item_mapping.parquet
  album_map: data/raw/album_item_mapping.parquet

label:
  # «клик» = дослушал рекомендованный трек минимум до этой доли (в процентах)
  ratio_threshold: 50
  # окно для вторичной метки «лайк после прослушивания», секунды
  like_window_sec: 3600

# Дни включительно. Признаки для показа в день d считаются ТОЛЬКО по событиям дней < d.
split:
  train_days: [226, 285]   # 60 дней с метками для обучения; история для признаков — всё до них
  val_days: [286, 292]     # подбор признаков и гиперпараметров
  gap_days: [293, 293]     # буфер, не используется
  test_days: [294, 400]    # итоговая оценка, открываем один раз в конце
